
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | ProcrastiSense AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #ffffff;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      border-radius: 16px;
      background: #1b2638;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    h2 {
      margin-top: 0;
    }

    p {
      color: #aab6c8;
      line-height: 1.6;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #40506a;
      border-radius: 8px;
      background: #101827;
      color: white;
      font-size: 14px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #6c63ff;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    a {
      color: #a49fff;
      text-decoration: none;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="reset-card">
    <h2>Choose a New Password</h2>
    <p>Enter your new password below to regain access to your ProcrastiSense AI account.</p>

    <form id="reset-form">
      <label for="new-password">New Password</label>
      <input
        type="password"
        id="new-password"
        minlength="8"
        placeholder="Enter new password"
        required
      >

      <label for="confirm-password">Confirm Password</label>
      <input
        type="password"
        id="confirm-password"
        minlength="8"
        placeholder="Confirm new password"
        required
      >

      <button type="submit" id="reset-button">Reset Password</button>
    </form>

    <p id="message"></p>

    <a class="back-link" href="/">Back to Login</a>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get("token");

    const form = document.getElementById("reset-form");
    const message = document.getElementById("message");
    const button = document.getElementById("reset-button");

    if (!token) {
      message.textContent = "Invalid reset link. Please request a new one.";
      form.style.display = "none";
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const new_password = document.getElementById("new-password").value;
      const confirm_password = document.getElementById("confirm-password").value;

      if (new_password !== confirm_password) {
        message.textContent = "Passwords do not match.";
        return;
      }

      button.disabled = true;
      button.textContent = "Resetting...";

      try {
        const response = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            token,
            new_password,
            confirm_password
          })
        });

        const data = await response.json();

        message.textContent = data.message;

        if (response.ok) {
          form.style.display = "none";
        }
      } catch (error) {
        message.textContent = "Unable to connect to the server. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Reset Password";
      }
    });
  </script>
</body>
</html>
